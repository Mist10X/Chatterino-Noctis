name: Issue report
description: Report something that's missing, that you have trouble with or that stopped working
labels: [issue-report]

body:
  - type: checkboxes
    id: acknowledgments
    attributes:
      label: Checklist
      description:
      options:
        - label: I'm reporting a problem with Chatterino Noctis
          required: true
        - label: I've verified that I'm running **the most** recent nightly build or stable release
          required: true
        - label: I've looked for my problem in the [user guide](https://github.com/Mist10X/chatterino-noctis/blob/HEAD/tools/release/Руководство.html)
          required: true
        - label: I've searched the [Chatterino Noctis issues and pull requests](https://github.com/Mist10X/chatterino-noctis/issues?q=) for similar reports
          required: true

  - type: textarea
    id: description
    validations:
      required: true
    attributes:
      label: Describe your issue
      description: |
        Write a brief description of your issue.
        Important:
            Focus on the problem instead of a concrete solution. This ensures that the focus of the thread is to resolve your issue.
            If you want to voice a concrete idea you can add a comment below after posting the issue.
      placeholder: |
        Examples:
          - I cannot do X.
          - I have trouble doing X.
          - Feature X has stopped working for me.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: While optional, it's highly encouraged to include screenshots or videos to illustrate what you mean.
      placeholder: You can upload them using the text editor's dedicated button.

  - type: textarea
    id: versions
    validations:
      required: true
    attributes:
      label: Operating system and Chatterino Noctis version
      description: Enter your operating system and the version shown in Settings → About.
      placeholder: Chatterino Noctis version … on Windows 11
